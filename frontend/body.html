<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>UniGuard</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
        }

       body {
    width: 100%;
    min-height: 100vh;
    margin: 0;
    background: #078bf5;
}

        
.app {
    width: 100%;
    min-height: 100vh;
    background: #078bf5;
    position: relative;
    overflow: hidden;
    padding: 18px;
    isolation: isolate;
}

.app::before {
    content: "";
    position: absolute;
    inset: 0;
    background-image: url("/static/unizulu-logo.png");
    background-repeat: no-repeat;
    background-position: center;
    background-size: 300px;
    opacity: 0.15;
    z-index: 0;
    pointer-events: none;
}

.app > * {
    position: relative;
    z-index: 1;
}
        /* Profile */
        .profile {
            position: absolute;
            top: 17px;
            left: 25px;
            width: 64px;
            height: 42px;
            border-radius: 50%;
            background: #e5e5e5;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #111;
            font-size: 16px;
        }

        /* Menu */
        .menu {
            position: absolute;
            top: 20px;
            right: 34px;
            width: 63px;
            height: 60px;
            background: #e8f4ff;
            border: none;
            cursor: pointer;
            padding: 13px 8px;
        }

        .menu span {
            display: block;
            height: 2px;
            background: #222;
            margin: 8px 0;
        }

        /* Hello */
        .hello {
            position: absolute;
            top: 135px;
            width: 100%;
            left: 0;
            text-align: center;
            color: white;
            font-size: 52px;
            font-weight: 300;
        }

        /* Speech bubbles */
        .bubble {
            position: absolute;
            border: 1.5px solid #111;
            background: #078bf5;
            color: white;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 14px;
        }

        .bubble::after {
            content: "";
            position: absolute;
            width: 18px;
            height: 13px;
            background: #078bf5;
            border-left: 1.5px solid #111;
            border-bottom: 1.5px solid #111;
            transform: rotate(-20deg);
        }

        .sawubona {
            width: 72px;
            height: 72px;
            top: 40px;
            left: 50%;
            transform: translateX(-50%);
        }

        .sawubona::after {
            bottom: -8px;
            left: 2px;
        }

        .ndaa {
            width: 72px;
            height: 72px;
            top: 130px;
            left: 55px;
        }

        .ndaa::after {
            bottom: -7px;
            left: 3px;
        }

        .dumela {
            width: 72px;
            height: 72px;
            top: 135px;
            right: 58px;
        }

        .dumela::after {
            bottom: -7px;
            left: 2px;
        }

        .molo {
            width: 72px;
            height: 72px;
            top: 215px;
            left: 50%;
            transform: translateX(-50%);
        }

        .molo::after {
            bottom: -8px;
            left: 2px;
        }

        /* Chat input */
        .chat-box {
            position: absolute;
            bottom: 22px;
            left: 43px;
            right: 43px;
            height: 70px;
            background: white;
            border: 1px solid #111;
            border-radius: 40px;
            display: flex;
            align-items: center;
        }

        .plus {
            width: 55px;
            font-size: 30px;
            font-weight: 200;
            background: none;
            border: none;
            cursor: pointer;
            color: #222;
        }

        #message {
            flex: 1;
            border: none;
            outline: none;
            text-align: center;
            font-size: 14px;
        }

        .send {
            width: 65px;
            background: none;
            border: none;
            font-size: 38px;
            cursor: pointer;
            color: #222;
        }

        /* Chat screen */
        .chat-screen {
            display: none;
            position: absolute;
            inset: 0;
            background: #f4f4f4;
            z-index: 10;
        }

        .chat-header {
            height: 70px;
            background: #078bf5;
            color: white;
            display: flex;
            align-items: center;
            padding: 0 20px;
            font-size: 22px;
        }

        .back {
            border: none;
            background: none;
            color: white;
            font-size: 30px;
            cursor: pointer;
            margin-right: 15px;
        }

        .messages {
            height: calc(100% - 140px);
            padding: 20px;
            overflow-y: auto;
        }

        .message {
            max-width: 75%;
            padding: 12px 16px;
            margin-bottom: 12px;
            border-radius: 18px;
            line-height: 1.4;
        }

        .user-message {
            background: #078bf5;
            color: white;
            margin-left: auto;
        }

        .bot-message {
            background: white;
            color: #222;
        }

        .chat-input {
            position: absolute;
            bottom: 15px;
            left: 15px;
            right: 15px;
            height: 55px;
            display: flex;
            background: white;
            border-radius: 30px;
            overflow: hidden;
        }

        .chat-input input {
            flex: 1;
            border: none;
            outline: none;
            padding: 15px;
        }

        .chat-input button {
            width: 60px;
            border: none;
            background: #078bf5;
            color: white;
            font-size: 25px;
            cursor: pointer;
        }

        @media (max-width: 500px) {
            .app {
                min-height: 100vh;
            }

            .hello {
                font-size: 45px;
            }

            .chat-box {
                left: 20px;
                right: 20px;
            }

            .ndaa {
                left: 30px;
            }

            .dumela {
                right: 30px;
            }
        }
    </style>
</head>

<body>

<div class="app">

    <!-- Main UniGuide screen -->
    <div class="profile">LS</div>


    <div class="bubble sawubona">Sawubona</div>
    <div class="bubble ndaa">Ndaa</div>
    <div class="bubble dumela">Dumela</div>
    <div class="bubble molo">Molo</div>

    <div class="hello">Hello</div>

    <div class="chat-box">
        <button class="plus" onclick="openAcademic()">+</button>

        <input
            id="message"
            type="text"
            placeholder="Ask here"
            onkeydown="if(event.key === 'Enter') sendMessage()"
        >

        <button class="send" onclick="sendMessage()">→</button>
    </div>


    <!-- Chat screen -->
    <div class="chat-screen" id="chatScreen">

        <div class="chat-header">
            <button class="back" onclick="closeChat()">←</button>
            UniGuard
        </div>

        <div class="messages" id="messages">

            <div class="message bot-message">
                👋 Sawubona! I am UniGuide. How can I help you?
            </div>

        </div>

        <div class="chat-input">

            <input
                id="chatMessage"
                type="text"
                placeholder="Ask UniGuide..."
                onkeydown="if(event.key === 'Enter') chatSend()"
            >

            <button onclick="chatSend()">→</button>

        </div>

    </div>

</div>



<script>

let conversationHistory = [];

function sendMessage() {

    const input = document.getElementById("message");
    const text = input.value.trim();

    if (text === "") return;

    openChat();

    document.getElementById("chatMessage").value = text;

    input.value = "";

    chatSend();
}

async function chatSend() {

    const input = document.getElementById("chatMessage");
    const messages = document.getElementById("messages");

    const text = input.value.trim();

    if (text === "") return;


    // Display user's message
    const userMessage = document.createElement("div");

    userMessage.className = "message user-message";
    userMessage.textContent = text;

    messages.appendChild(userMessage);

    input.value = "";


    // Show loading message
    const botMessage = document.createElement("div");

    botMessage.className = "message bot-message";
    botMessage.textContent = "UniGuide is thinking...";

    messages.appendChild(botMessage);

    messages.scrollTop = messages.scrollHeight;


    try {

        // Send current message AND previous conversation
        const response = await fetch("/chat", {

            method: "POST",

            headers: {
                "Content-Type": "application/json"
            },

            body: JSON.stringify({

                message: text,

                history: conversationHistory

            })

        });


        // Get Flask response
        const data = await response.json();


        // Get AI response
        let reply = "";

        if (data.response) {

            reply = data.response;

        } else if (data.reply) {

            reply = data.reply;

        } else {

            reply =
                "Sorry, I could not understand the response.";

        }


        // Display AI response
        botMessage.textContent = reply;


        // Save this conversation
        conversationHistory.push({

            role: "user",

            content: text

        });


        conversationHistory.push({

            role: "assistant",

            content: reply

        });


    } catch (error) {

        console.error("Chat error:", error);

        botMessage.textContent =
            "❌ Sorry, I could not connect to UniGuide's server.";

    }


    messages.scrollTop = messages.scrollHeight;

}


function openChat() {

    document.getElementById("chatScreen").style.display = "block";

}


function closeChat() {

    document.getElementById("chatScreen").style.display = "none";

}


function openAcademic() {

    window.location.href = "/academic";

}

</script>

</body>
</html>
