<body>

```
<div class="register-container">

    <div class="header">

        <img
            src="/static/unizulu-logo.png"
            alt="University of Zululand Logo"
            class="logo"
        >

        <h1>Create Account</h1>

        <p class="subtitle">
            Create your UniGuide student account
        </p>

    </div>

    <form id="registerForm">

        <div class="input-group">

            <label for="username">
                Username
            </label>

            <input
                type="text"
                id="username"
                placeholder="Create a username"
                required
                minlength="3"
            >

        </div>

        <div class="input-group">

            <label for="password">
                Password
            </label>

            <input
                type="password"
                id="password"
                placeholder="Create a password"
                required
                minlength="6"
            >

            <p class="password-help">
                Password must contain at least 6 characters.
            </p>

        </div>

        <div class="input-group">

            <label for="confirmPassword">
                Confirm Password
            </label>

            <input
                type="password"
                id="confirmPassword"
                placeholder="Enter your password again"
                required
            >

        </div>

        <div class="input-group">

            <label for="recoveryQuestion">
                Password Recovery Question
            </label>

            <select id="recoveryQuestion" required>

                <option value="">
                    Select a question
                </option>

                <option value="What was the name of your first school?">
                    What was the name of your first school?
                </option>

                <option value="What is your favourite subject?">
                    What is your favourite subject?
                </option>

                <option value="What is your favourite hobby?">
                    What is your favourite hobby?
                </option>

                <option value="What is your favourite sport?">
                    What is your favourite sport?
                </option>

            </select>

        </div>

        <div class="input-group">

            <label for="recoveryAnswer">
                Recovery Answer
            </label>

            <input
                type="text"
                id="recoveryAnswer"
                placeholder="Enter your answer"
                required
            >

        </div>

        <button
            type="submit"
            class="register-button"
            id="registerButton"
        >
            Create Account
        </button>

    </form>

    <div id="message" class="message"></div>

    <div class="login-link">
        Already have an account?
        <a href="/login">
            Login
        </a>
    </div>

    <div class="footer">
        UniGuide • University of Zululand
    </div>

</div>

<script>

    const registerForm =
        document.getElementById("registerForm");

    const registerButton =
        document.getElementById("registerButton");

    const message =
        document.getElementById("message");


    registerForm.addEventListener("submit", async function(event) {

        event.preventDefault();

        const username =
            document.getElementById("username").value.trim();

        const password =
            document.getElementById("password").value;

        const confirmPassword =
            document.getElementById("confirmPassword").value;

        const recoveryQuestion =
            document.getElementById("recoveryQuestion").value;

        const recoveryAnswer =
            document.getElementById("recoveryAnswer").value.trim();


        message.className = "message";
        message.textContent = "";


        if (password !== confirmPassword) {

            message.className = "message error";

            message.textContent =
                "The passwords do not match.";

            return;
        }


        registerButton.disabled = true;
        registerButton.textContent = "Creating account...";


        try {

            const response = await fetch("/register", {

                method: "POST",

                headers: {
                    "Content-Type": "application/json"
                },

                body: JSON.stringify({

                    username: username,

                    password: password,

                    recovery_question:
                        recoveryQuestion,

                    recovery_answer:
                        recoveryAnswer

                })

            });


            const data = await response.json();


            if (response.ok && data.success) {

                message.className =
                    "message success";

                message.textContent =
                    "Account created successfully! Opening UniGuide...";


                setTimeout(function() {

                    window.location.href = "/";

                }, 1000);


            } else {

                message.className =
                    "message error";

                message.textContent =
                    data.message ||
                    "Could not create your account.";

                registerButton.disabled = false;

                registerButton.textContent =
                    "Create Account";
            }


        } catch (error) {

            console.error(
                "Registration error:",
                error
            );

            message.className =
                "message error";

            message.textContent =
                "Could not connect to UniGuide. Please try again.";

            registerButton.disabled = false;

            registerButton.textContent =
                "Create Account";
        }

    });

</script>


</body>
